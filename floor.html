<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Studio — 办公室平面图</title>
<style>
  :root{
    --bg:#0b0d10; --floor:#12161b; --room:#171c23; --roomline:#2c333c;
    --corridor:#1a2028; --fg:#e7ebf0; --muted:#8b939e; --ok:#3fb950; --accent:#5b9dff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--roomline)}
  h1{font-size:15px;margin:0}
  .sub{color:var(--muted);font-size:12px}
  .kpis{margin-left:auto;display:flex;gap:16px;font-variant-numeric:tabular-nums}
  .kpi b{display:block;font-size:16px}.kpi span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .wrap{display:grid;grid-template-columns:1fr 300px;gap:16px;padding:16px 18px 40px}
  @media (max-width:1000px){.wrap{grid-template-columns:1fr}}
  svg{width:100%;height:auto;background:var(--floor);border:1px solid var(--roomline);border-radius:10px}
  .roomBox{fill:var(--room);stroke:var(--roomline);stroke-width:1.5}
  .roomBox.hot{stroke:var(--ok);stroke-opacity:.5}
  .roomTitle{fill:var(--fg);font-size:12px;font-weight:600}
  .roomMeta{fill:var(--muted);font-size:10px}
  .corridor{fill:var(--corridor);stroke:var(--roomline);stroke-width:1;stroke-dasharray:6 4}
  .corridorLabel{fill:var(--muted);font-size:10px;letter-spacing:.14em}
  .legend{fill:var(--muted);font-size:10.5px}
  .name{fill:var(--muted);font-size:9.5px}
  .bubble{fill:#0f141a;stroke:var(--roomline);stroke-width:1}
  .bubbleText{fill:var(--fg);font-size:9px}
  .visitorText{fill:var(--fg);font-size:10.5px}
  .visitorState{fill:var(--muted);font-size:9.5px}
  /* 打字动画：只在 .working 的角色上跑 */
  .worker .arm-l,.worker .arm-r{transition:transform .2s}
  .worker.working .arm-l{animation:typeA .45s ease-in-out infinite alternate}
  .worker.working .arm-r{animation:typeB .45s ease-in-out infinite alternate}
  .worker.working .screen{fill:#7ee2a8}
  .worker.working .glow{opacity:.5;animation:glow 1.8s ease-in-out infinite}
  .worker .glow{opacity:0;transition:opacity .3s}
  .worker.working .head{animation:bob 1.6s ease-in-out infinite}
  @keyframes typeA{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
  @keyframes typeB{from{transform:translateY(-1.6px)}to{transform:translateY(0)}}
  @keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.6px)}}
  aside{border:1px solid var(--roomline);border-radius:10px;background:var(--floor);padding:12px 14px;align-self:start}
  aside h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:12px}
  .role{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .hint{color:var(--muted);font-size:11.5px;margin-top:10px}
  .empty{color:var(--muted);font-size:12px}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>Agent Studio · 办公室</h1>
  <span class="sub" id="sub">连接中…</span>
  <div class="kpis">
    <div class="kpi"><b id="k-work">0</b><span>working</span></div>
    <div class="kpi"><b id="k-sub">0</b><span>subagents</span></div>
    <div class="kpi"><b id="k-visit">0</b><span>visitors</span></div>
    <div class="kpi"><b id="k-kb">0</b><span>kanban</span></div>
  </div>
</header>
<div class="wrap">
  <div><svg id="plan" viewBox="0 0 1440 900" role="img" aria-label="office floor plan with cartoon characters"></svg></div>
  <aside>
    <h2 id="detail-title">选中一个工位</h2>
    <div id="detail"><div class="empty">点办公室里的小人看角色详情；屏幕上发亮=正在工作。</div></div>
    <h2 style="margin-top:14px">活跃角色</h2>
    <div id="active"><div class="empty">无</div></div>
    <div class="hint">
      亮屏 + 打字 = 正在工作（来源：CCGS 审计流或工人任务文本）。<br>
      走廊里站着的是 Orca 监督中的来访工人。<br>
      <a href="/">← 回面板视图</a>
    </div>
  </aside>
</div>
<script>
// 平面图：两排办公室夹一条走廊。房间宽度按人数分配，每个角色一个小人。
const PLAN = [
  { y: 44, h: 300, rooms: ["directors", "leads", "engineering", "design"] },
  { y: 520, h: 300, rooms: ["art", "audio", "narrative", "qa", "engines", "community"] },
];
const CORRIDOR = { y: 358, h: 148 };
const CELL = { w: 46, h: 62 };
const SETTLED = ["succeeded", "failed", "stopped", "cancelled"];
const PALETTE = {
  skin: ["#f2c9a0", "#e8b98c", "#d59b6a", "#b5764a", "#8d5524"],
  hair: ["#2b2b2b", "#4a3527", "#7a5230", "#c9a227", "#8a8f98", "#3f4a5a"],
  shirt: ["#5b9dff", "#3fb950", "#d29922", "#f85149", "#a371f7", "#39c5cf", "#e8845b"],
};
let roster = null, state = null, selected = null;

const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, text) => {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
};
const isPresent = (w) => w.liveness === "live" || w.dispatchStatus === "pending";
const isWorking = (w) => isPresent(w) && !SETTLED.includes(w.workerState || "");

/** 角色名 → 稳定的外观（同一角色每次刷新长相一致）。 */
function look(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return {
    skin: PALETTE.skin[h % PALETTE.skin.length],
    hair: PALETTE.hair[(h >> 3) % PALETTE.hair.length],
    shirt: PALETTE.shirt[(h >> 6) % PALETTE.shirt.length],
    hairstyle: (h >> 9) % 3,
  };
}

/** 一个坐在桌前的小人：椅子、身体、头（含发型/眼睛）、手臂、桌子、显示器、键盘、杯子。 */
function worker(x, y, agentName, roomName) {
  const v = look(agentName);
  const g = mk("g", { class: "worker", "data-role": agentName, transform: `translate(${x},${y})` });
  g.style.cursor = "pointer";

  g.appendChild(mk("rect", { x: 6, y: 26, width: 26, height: 22, rx: 4, fill: "#222a33" }));           // 椅背
  g.appendChild(mk("rect", { x: 12, y: 44, width: 14, height: 10, rx: 3, fill: "#2b3440" }));         // 椅座
  g.appendChild(mk("rect", { x: 13, y: 10, width: 12, height: 18, rx: 4, fill: v.shirt }));           // 躯干
  const arms = mk("g");
  arms.appendChild(mk("rect", { class: "arm-l", x: 8, y: 22, width: 5, height: 10, rx: 2, fill: v.skin }));
  arms.appendChild(mk("rect", { class: "arm-r", x: 25, y: 22, width: 5, height: 10, rx: 2, fill: v.skin }));
  g.appendChild(arms);
  g.appendChild(mk("circle", { class: "head", cx: 19, cy: 7, r: 6.2, fill: v.skin }));                 // 头
  if (v.hairstyle === 0) g.appendChild(mk("path", { d: "M12.8 6.4 A6.2 6.2 0 0 1 25.2 6.4 L25.2 4.4 A6.2 5 0 0 0 12.8 4.4 Z", fill: v.hair }));
  if (v.hairstyle === 1) g.appendChild(mk("path", { d: "M12.8 6.8 A6.4 6.4 0 0 1 25.2 6.8 Q19 1.6 12.8 6.8 Z", fill: v.hair }));
  if (v.hairstyle === 2) {
    g.appendChild(mk("path", { d: "M12.6 7 A6.4 6.4 0 0 1 25.4 7 L25.4 5.6 A6.4 5.4 0 0 0 12.6 5.6 Z", fill: v.hair }));
    g.appendChild(mk("circle", { cx: 25.6, cy: 5.2, r: 2.2, fill: v.hair }));
  }
  g.appendChild(mk("circle", { cx: 17, cy: 7, r: .8, fill: "#1b2026" }));
  g.appendChild(mk("circle", { cx: 21, cy: 7, r: .8, fill: "#1b2026" }));

  g.appendChild(mk("rect", { x: 2, y: 34, width: 34, height: 4, rx: 1, fill: "#39424e" }));            // 桌面
  g.appendChild(mk("rect", { class: "glow", x: 0, y: 20, width: 40, height: 16, rx: 8, fill: "#3fb950", opacity: 0 }));
  g.appendChild(mk("rect", { x: 9, y: 22, width: 20, height: 13, rx: 2, fill: "#11161c", stroke: "#39424e", "stroke-width": 1 }));
  g.appendChild(mk("rect", { class: "screen", x: 11, y: 24, width: 16, height: 9, rx: 1, fill: "#2b4a63" }));
  g.appendChild(mk("rect", { x: 12, y: 30.5, width: 14, height: 2.5, rx: 1, fill: "#2b3440" }));       // 键盘
  g.appendChild(mk("rect", { x: 31, y: 30, width: 4, height: 5, rx: 1, fill: "#c96f4a" }));           // 杯子
  g.appendChild(mk("title", {}, `${agentName} · ${roomName}`));
  g.addEventListener("click", () => { selected = agentName; paint(state); });
  return g;
}

/** 站着的小人（走廊里的来访工人）。 */
function stander(x, y, label, working) {
  const v = look(label);
  const g = mk("g", { class: "worker" + (working ? " working" : ""), transform: `translate(${x},${y})` });
  g.appendChild(mk("rect", { x: 7, y: 14, width: 12, height: 20, rx: 4, fill: v.shirt }));
  g.appendChild(mk("rect", { x: 8, y: 34, width: 4, height: 14, rx: 2, fill: "#2b3440" }));
  g.appendChild(mk("rect", { x: 14, y: 34, width: 4, height: 14, rx: 2, fill: "#2b3440" }));
  g.appendChild(mk("rect", { class: "arm-l", x: 3, y: 16, width: 4, height: 13, rx: 2, fill: v.skin }));
  g.appendChild(mk("rect", { class: "arm-r", x: 19, y: 16, width: 4, height: 13, rx: 2, fill: v.skin }));
  g.appendChild(mk("circle", { class: "head", cx: 13, cy: 9, r: 6, fill: v.skin }));
  g.appendChild(mk("path", { d: "M7 8.6 A6 6 0 0 1 19 8.6 L19 6.4 A6 5 0 0 0 7 6.4 Z", fill: v.hair }));
  g.appendChild(mk("circle", { cx: 11, cy: 9, r: .8, fill: "#1b2026" }));
  g.appendChild(mk("circle", { cx: 15, cy: 9, r: .8, fill: "#1b2026" }));
  return g;
}

function activeRoles() {
  const hits = new Set();
  for (const a of (state.audit?.agents || [])) if (a.active > 0) hits.add(a.agent);
  for (const w of state.workers) {
    if (!isWorking(w)) continue;
    const blob = [w.taskTitle, w.taskSpec, w.label, w.worktreeName, w.agent].filter(Boolean).join(" ").toLowerCase();
    for (const a of roster.agents) if (blob.includes(a.name.toLowerCase())) hits.add(a.name);
  }
  return hits;
}

/** 房间里的小人网格：列数按房间宽高比算；小房间一列并显示名字。 */
function seats(room, agents) {
  const innerW = room.w - 24, innerH = room.h - 54;
  const cols = agents.length <= 4 ? 1 : Math.max(2, Math.min(9, Math.round(Math.sqrt(agents.length * (innerW / innerH) * (CELL.h / CELL.w)))));
  const rows = Math.ceil(agents.length / cols);
  const cellW = innerW / cols, cellH = innerH / Math.max(rows, 1);
  return agents.map((a, i) => ({
    agent: a,
    x: room.x + 14 + (i % cols) * cellW,
    y: room.y + 44 + Math.floor(i / cols) * cellH,
  }));
}

function roomGeometry(perRoom) {
  const out = [];
  for (const band of PLAN) {
    const total = band.rooms.reduce((n, r) => n + perRoom[r], 0);
    const usable = 1440 - 40 - (band.rooms.length - 1) * 12;
    let x = 20;
    for (const name of band.rooms) {
      const w = Math.max(140, Math.round((usable * perRoom[name]) / total));
      out.push({ name, x, y: band.y, w, h: band.h });
      x += w + 12;
    }
  }
  return out;
}

function drawPlan() {
  const perRoom = {};
  for (const r of roster.rooms) perRoom[r] = roster.agents.filter((a) => a.room === r).length;
  const svg = document.getElementById("plan");
  svg.textContent = "";

  const defs = mk("defs");
  const pat = mk("pattern", { id: "carpet", width: 20, height: 20, patternUnits: "userSpaceOnUse" });
  pat.appendChild(mk("path", { d: "M 20 0 L 0 0 0 20", fill: "none", stroke: "#191f27", "stroke-width": 1 }));
  defs.appendChild(pat);
  svg.appendChild(defs);
  svg.appendChild(mk("rect", { x: 0, y: 0, width: 1440, height: 900, fill: "url(#carpet)" }));

  svg.appendChild(mk("rect", { class: "corridor", x: 20, y: CORRIDOR.y, width: 1400, height: CORRIDOR.h, rx: 10 }));
  svg.appendChild(mk("text", { class: "corridorLabel", x: 34, y: CORRIDOR.y + 20 }, "CORRIDOR · VISITING WORKERS (ORCA)"));

  for (const room of roomGeometry(perRoom)) {
    const agents = roster.agents.filter((a) => a.room === room.name);
    const g = mk("g", { "data-room": room.name });
    g.appendChild(mk("rect", { class: "roomBox", x: room.x, y: room.y, width: room.w, height: room.h, rx: 12 }));
    g.appendChild(mk("text", { class: "roomTitle", x: room.x + 14, y: room.y + 22 }, room.name));
    g.appendChild(mk("text", { class: "roomMeta", x: room.x + room.w - 14, y: room.y + 22, "text-anchor": "end", "data-meta": room.name }, `${agents.length}`));
    // 房间绿植（纯装饰，让场景像办公室）
    g.appendChild(mk("rect", { x: room.x + room.w - 26, y: room.y + room.h - 30, width: 12, height: 12, rx: 2, fill: "#5a4634" }));
    g.appendChild(mk("circle", { cx: room.x + room.w - 20, cy: room.y + room.h - 34, r: 8, fill: "#2f6b46" }));
    for (const seat of seats(room, agents)) {
      g.appendChild(worker(seat.x, seat.y, seat.agent.name, seat.agent.room));
      if (agents.length <= 4) g.appendChild(mk("text", { class: "name", x: seat.x + 42, y: seat.y + 30 }, seat.agent.name));
    }
    svg.appendChild(g);
  }

  svg.appendChild(mk("circle", { cx: 30, cy: 878, r: 6, fill: "#2b4a63" }));
  svg.appendChild(mk("text", { class: "legend", x: 44, y: 882 }, "idle（屏幕暗）"));
  svg.appendChild(mk("circle", { cx: 160, cy: 878, r: 6, fill: "#7ee2a8" }));
  svg.appendChild(mk("text", { class: "legend", x: 174, y: 882 }, "working（屏幕亮 + 打字）· 点小人看详情"));
}

function paint(st) {
  state = st;
  const hits = activeRoles();
  const svg = document.getElementById("plan");

  for (const w of svg.querySelectorAll(".worker[data-role]")) {
    const on = hits.has(w.dataset.role);
    w.classList.toggle("working", on);
    w.querySelector(".head")?.classList.toggle("bob", on);
  }
  for (const g of svg.querySelectorAll("g[data-room]")) {
    const room = g.dataset.room;
    const members = roster.agents.filter((a) => a.room === room);
    const busy = members.filter((a) => hits.has(a.name)).length;
    g.querySelector(".roomBox").classList.toggle("hot", busy > 0);
    const meta = g.querySelector(`[data-meta="${room}"]`);
    if (meta) meta.textContent = `${members.length}${busy ? " · " + busy + " 忙" : ""}`;
  }

  for (const old of svg.querySelectorAll("g[data-visitor]")) old.remove();
  const visitors = state.workers.filter(isPresent).slice(0, 7);
  visitors.forEach((w, i) => {
    const x = 50 + i * 194, y = CORRIDOR.y + 42;
    const g = mk("g", { "data-visitor": w.dispatchId });
    g.appendChild(mk("rect", { class: "bubble", x, y: y - 34, width: 182, height: 30, rx: 7 }));
    g.appendChild(mk("text", { class: "visitorText", x: x + 10, y: y - 20 }, (w.label || w.dispatchId).slice(0, 27)));
    g.appendChild(mk("text", { class: "visitorState", x: x + 10, y: y - 9 }, `${w.workerState || w.dispatchStatus || "-"} · ${w.liveness || "-"}`.slice(0, 30)));
    g.appendChild(stander(x + 80, y, w.label || w.dispatchId, isWorking(w)));
    if (isWorking(w)) g.querySelector(".worker")?.classList.add("working");
    svg.appendChild(g);
  });
  if (!visitors.length) svg.appendChild(mk("text", { class: "corridorLabel", x: 40, y: CORRIDOR.y + 80 }, "（走廊空着：当前没有 Orca 监督的工人）"));

  // KPI 与地板一致：亮着的小人数 = 活跃角色数（审计流 ∪ 工人任务文本）
  document.getElementById("k-work").textContent = hits.size;
  document.getElementById("k-sub").textContent = (state.audit?.agents || []).reduce((n, a) => n + a.active, 0);
  document.getElementById("k-visit").textContent = state.workers.filter(isPresent).length;
  document.getElementById("k-kb").textContent = state.kanban.length;
  document.getElementById("sub").textContent = `状态 ${new Date(state.ts).toLocaleTimeString()} · ${state.worktrees.length} 仓库 · ${hits.size} 角色工作中`;

  const detail = document.getElementById("detail");
  detail.textContent = "";
  if (!selected) {
    detail.appendChild(Object.assign(document.createElement("div"), { className: "empty", textContent: "点办公室里的小人看角色详情；屏幕发亮=正在工作。" }));
  } else {
    const a = roster.agents.find((x) => x.name === selected);
    const last = (state.audit?.events || []).filter((e) => e.agent === selected).slice(-1)[0];
    const rows = [
      ["房间", a.room],
      ["档位", a.model],
      ["状态", hits.has(a.name) ? "工作中" : "空闲"],
      ["最近审计", last ? `${last.kind === "invoked" ? "▶ invoked" : "■ completed"} ${last.ts.slice(-6)}` : "无记录"],
    ];
    for (const [k, v] of rows) {
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(Object.assign(document.createElement("span"), { textContent: k }));
      row.appendChild(Object.assign(document.createElement("b"), { className: "role", textContent: String(v) }));
      detail.appendChild(row);
    }
    const desc = document.createElement("div");
    desc.className = "hint";
    desc.textContent = a.desc;
    detail.appendChild(desc);
    document.getElementById("detail-title").textContent = a.name;
  }

  const act = document.getElementById("active");
  act.textContent = "";
  if (!hits.size) act.appendChild(Object.assign(document.createElement("div"), { className: "empty", textContent: "无" }));
  for (const role of [...hits].sort()) {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(Object.assign(document.createElement("span"), { className: "role", textContent: role }));
    row.appendChild(Object.assign(document.createElement("b"), { textContent: roster.agents.find((a) => a.name === role)?.room ?? "—" }));
    act.appendChild(row);
  }
}

async function tick() {
  try { paint(await (await fetch("/state", { cache: "no-store" })).json()); }
  catch (e) { document.getElementById("sub").textContent = "服务未响应：" + e.message; }
}
(async () => {
  roster = await (await fetch("/roster.json")).json();
  drawPlan();
  await tick();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
