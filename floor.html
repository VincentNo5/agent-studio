<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Studio — 办公室平面图</title>
<style>
  :root{
    --bg:#07090d; --line:#1f2733; --fg:#e8edf4; --muted:#8d97a6; --dim:#5f6a7a;
    --mint:#5cf2b5; --cyan:#6ad8ff; --violet:#b08cff; --amber:#f5b65c; --rose:#ff7a8a;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--fg);background:radial-gradient(1100px 520px at 18% -8%,#121a26 0,transparent 70%),var(--bg);font:13px/1.5 ui-sans-serif,-apple-system,"SF Pro Text","PingFang SC",Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:20px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f141c,#0a0d12)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 30% 28%,#9af7d6,#2a9a9c 55%,#173946);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 6px 18px -6px rgba(92,242,181,.6)}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em;line-height:1.2}
  .crumb{color:var(--dim);font-size:11px;letter-spacing:.04em}
  .live{display:inline-flex;align-items:center;gap:8px;padding:4px 11px 4px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.02)}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(92,242,181,.15);animation:pulse 2s ease-in-out infinite}
  body.down .live i{background:var(--rose);box-shadow:0 0 0 3px rgba(255,122,138,.15);animation:none}
  .sub{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .kpis{margin-left:auto;display:flex;gap:8px}
  .kpi{min-width:94px;padding:7px 12px 8px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
  .kpi span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
  .kpi span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .kpi b{display:block;margin-top:1px;font-size:20px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
  @media (max-width:860px){header{flex-wrap:wrap}.kpis{margin-left:0}}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:18px 22px 40px}
  @media (max-width:1100px){.wrap{grid-template-columns:1fr}}
  .stage{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#090c11;box-shadow:0 24px 60px -28px rgba(0,0,0,.85)}
  #plan{display:block;width:100%;height:auto;user-select:none}
  aside{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:16px}
  .card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#10151d,#0c1016);padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .card h2,.eyebrow{margin:0 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .eyebrow{margin-bottom:4px}
  #detail-title{margin-bottom:8px;font:600 15px/1.35 var(--mono);letter-spacing:0;text-transform:none;color:var(--fg);word-break:break-all}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
  .row:last-child{border-bottom:0}
  .row>span{color:var(--muted)}
  .row b{font-weight:500;text-align:right}
  .role{font-family:var(--mono);font-size:11.5px}
  .role.on{color:var(--mint)}
  .role.on::before,#active .row span.role::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);vertical-align:1px}
  #active{max-height:320px;overflow:auto}
  #active .row b{color:var(--muted);font-weight:400;font-size:11.5px}
  .hint{color:var(--muted);font-size:11.5px;line-height:1.6}
  .hint p{display:flex;gap:9px;align-items:baseline;margin:0 0 8px}
  #detail .hint{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px}
  .sw{flex:none;width:8px;height:8px;border-radius:2px;background:var(--mint);box-shadow:0 0 8px rgba(92,242,181,.6)}
  .sw.visit{background:var(--amber);box-shadow:0 0 8px rgba(245,182,92,.5)}
  .empty{color:var(--dim);font-size:12px}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}

  /* —— 平面图 —— */
  #plan text{font-family:inherit}
  .planTitle{fill:var(--dim);font-size:10px;font-weight:600;letter-spacing:.24em}
  .roomBox{fill:url(#wood);stroke:#2d3747;stroke-width:3;transition:stroke .4s}
  .roomBox.hot{stroke:var(--mint);stroke-opacity:.7;filter:url(#hotGlow)}
  .lamp{opacity:.5;transition:opacity .6s}
  .roomBox.hot~.lamp{opacity:1}
  .roomTitle{fill:var(--fg);font-size:11px;font-weight:700;letter-spacing:.16em}
  .roomMeta{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .roomBox.hot~.roomMeta{fill:#bdf7de}
  .rdot{fill:#3a4453}
  .roomBox.hot~.rdot{fill:var(--mint);animation:pulse 1.6s ease-in-out infinite}
  .win{fill:url(#glass);opacity:.6}
  .blind{stroke:#e2eeff;stroke-opacity:.4;stroke-width:3;stroke-dasharray:1 2.4}
  .glassWall{fill:none;stroke:#8fb8ef;stroke-opacity:.22;stroke-width:3}
  .glassLine{fill:none;stroke:#bcd7ff;stroke-opacity:.5;stroke-width:.7}
  .corridor{fill:url(#tile)}
  .lane{fill:none;stroke:var(--amber);stroke-opacity:.22;stroke-width:1.5}
  .lane.mid{stroke-opacity:.2;stroke-width:2;stroke-dasharray:1 11;stroke-linecap:round}
  .decal{fill:#6b7686;font-size:8.5px;font-weight:600;letter-spacing:.16em}
  .corridorLabel{fill:#7d8796;font-size:9.5px;font-weight:600;letter-spacing:.22em}
  .exit{fill:#7dffb8;font-size:7.5px;font-weight:700;letter-spacing:.08em}
  .legend text{fill:var(--muted);font-size:11px}
  .name{fill:#b7c0cc;font:500 9.5px var(--mono);pointer-events:none}
  .nameSub{fill:var(--dim);font-size:8.5px}
  .bubble{fill:#111821;stroke:#2e3a4a;stroke-width:1;filter:url(#drop)}
  .visitorText{fill:var(--fg);font-size:10.5px;font-weight:600}
  .visitorState{fill:var(--muted);font-size:9.5px;font-variant-numeric:tabular-nums}
  .vdot{fill:#4a5464}
  .vdot.wait{fill:var(--amber)}
  .vdot.on{fill:var(--mint);animation:pulse 1.4s ease-in-out infinite}
  .vig{pointer-events:none}

  /* —— 角色：空闲安静（暗屏、只眨眼）；.working 时亮屏、光晕、打字、点头、看向屏幕 —— */
  .worker[data-role]{cursor:pointer;outline:none}
  .sel{fill:none;stroke:var(--cyan);stroke-width:1.2;opacity:0;transition:opacity .2s}
  .worker[data-role]:hover .sel{opacity:.5}
  .worker.picked .sel{opacity:1;fill:rgba(106,216,255,.08)}
  .worker:focus-visible .sel{opacity:1;stroke:#fff;stroke-dasharray:3 2}
  .screen{fill:url(#scrOff)}
  .worker.working .screen{fill:url(#scrOn)}
  .code{fill:none;stroke:#0d4a45;stroke-width:1;stroke-linecap:round;stroke-dasharray:12;stroke-dashoffset:12;opacity:0}
  .worker.working .code{opacity:.8;animation:code 2.4s steps(7) infinite}
  .worker.working .code:nth-child(2){animation-delay:-.9s}
  .worker.working .code:nth-child(3){animation-delay:-1.7s}
  .glow{opacity:0;mix-blend-mode:screen;pointer-events:none;transition:opacity .5s}
  .worker.working .glow{opacity:1;animation:glow 3s ease-in-out infinite}
  .led{fill:#6b5326}
  .worker.working .led{fill:var(--mint)}
  .eyes{fill:#1a1d24;transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
  .look{transition:transform .4s}
  .worker.working .look{transform:translateX(.55px)}
  .specs{fill:none;stroke:#1d2129;stroke-width:.6}
  .lens{fill:rgba(170,210,255,.1)}
  .worker.working .lens{fill:rgba(130,255,215,.4)}
  .head{transform-box:fill-box;transform-origin:50% 100%}
  .worker.working .head{animation:nod 2.4s ease-in-out infinite}
  .worker.working .arm-l{animation:type .3s ease-in-out infinite alternate}
  .worker.working .arm-r{animation:type .3s ease-in-out -.15s infinite alternate}
  @keyframes type{from{transform:translateY(.3px)}to{transform:translateY(-1.3px)}}
  @keyframes nod{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(.5px) rotate(-2deg)}70%{transform:translateY(.2px) rotate(1.2deg)}}
  @keyframes glow{0%,100%{opacity:.8}45%{opacity:1}52%{opacity:.88}}
  @keyframes code{to{stroke-dashoffset:0}}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><i class="logo"></i><div><h1>Agent Studio</h1><div class="crumb">办公室平面图 · 3F</div></div></div>
  <span class="live"><i></i><span class="sub" id="sub">连接中…</span></span>
  <div class="kpis">
    <div class="kpi" style="--c:var(--mint)"><span>working</span><b id="k-work">0</b></div>
    <div class="kpi" style="--c:var(--violet)"><span>subagents</span><b id="k-sub">0</b></div>
    <div class="kpi" style="--c:var(--amber)"><span>visitors</span><b id="k-visit">0</b></div>
    <div class="kpi" style="--c:var(--cyan)"><span>kanban</span><b id="k-kb">0</b></div>
  </div>
</header>
<div class="wrap">
  <div class="stage"><svg id="plan" viewBox="0 0 1440 900" role="img" aria-label="office floor plan with cartoon characters"></svg></div>
  <aside>
    <section class="card">
      <div class="eyebrow">工位详情</div>
      <h2 id="detail-title">选中一个工位</h2>
      <div id="detail"><div class="empty">点办公室里的小人看角色详情；屏幕发亮 = 正在工作。</div></div>
    </section>
    <section class="card">
      <h2>活跃角色</h2>
      <div id="active"><div class="empty">无</div></div>
    </section>
    <section class="card hint">
      <p><i class="sw"></i><span>亮屏 + 打字 = 正在工作（来源：CCGS 审计流或工人任务文本）。</span></p>
      <p><i class="sw visit"></i><span>走廊里站着的是 Orca 监督中的来访工人。</span></p>
      <a href="/">← 回面板视图</a>
    </section>
  </aside>
</div>
<script>
// 平面图：两排办公室夹一条走廊。房间宽度按人数分配，每个角色一个小人。
const PLAN = [
  { y: 44, h: 300, rooms: ["directors", "leads", "engineering", "design"] },
  { y: 520, h: 300, rooms: ["art", "audio", "narrative", "qa", "engines", "community"] },
];
const CORRIDOR = { y: 358, h: 148 };
const CELL = { w: 46, h: 62 };
const SETTLED = ["succeeded", "failed", "stopped", "cancelled"];
const ACCENT = {
  directors: "#f2b35b", leads: "#b08cff", engineering: "#7d9bff", design: "#ff7eaa", art: "#e48cff",
  audio: "#3fd6c6", narrative: "#e6c86e", qa: "#9be15d", engines: "#42cfe6", community: "#ff8f70",
};
const PALETTE = {
  skin: ["#f6d2b0", "#eebf95", "#d9a173", "#b97a4e", "#94603b", "#6b4429"],
  hair: ["#1f1d1c", "#3b2a20", "#6b4428", "#a8743c", "#d6b26a", "#8d939c", "#b5523b"],
  shirt: ["#4f7cff", "#2fae86", "#e0a33c", "#e2566b", "#8b6cf0", "#2ba6c4", "#e47c4f", "#5f6b7d", "#c75b9b"],
  pants: ["#2a3140", "#33302c", "#1f2a3a", "#3a3346"],
  jacket: ["#2a3140", "#3b2f2b", "#22303b", "#3a3346"],
  mug: ["#e9e4da", "#e2566b", "#4f7cff", "#f2b35b"],
};
const DEFS = `<defs>
<pattern id="wood" width="120" height="28" patternUnits="userSpaceOnUse"><rect width="120" height="28" fill="#161b23"/><rect width="70" height="14" fill="#181e27"/><rect x="70" y="14" width="50" height="14" fill="#141920"/><path d="M0 .5h120M0 14.5h120M70.5 0v14M30.5 14v14M100.5 14v14" stroke="#10141a"/></pattern>
<pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#131921"/><rect width="20" height="20" fill="#151c25"/><rect x="20" y="20" width="20" height="20" fill="#151c25"/><path d="M0 .5h40M.5 0v40" stroke="#1b222c"/></pattern>
<linearGradient id="wallG" x2="0" y2="1"><stop offset="0" stop-color="#27303e"/><stop offset="1" stop-color="#1c232d"/></linearGradient>
<linearGradient id="chairG" x2="0" y2="1"><stop offset="0" stop-color="#343f51"/><stop offset="1" stop-color="#1a2029"/></linearGradient>
<linearGradient id="deskG" x2="0" y2="1"><stop offset="0" stop-color="#76604d"/><stop offset="1" stop-color="#4a392c"/></linearGradient>
<linearGradient id="shade"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
<linearGradient id="scrOff" x2="1" y2="1"><stop offset="0" stop-color="#1b2a40"/><stop offset="1" stop-color="#0a1018"/></linearGradient>
<linearGradient id="scrOn" x2="1" y2="1"><stop offset="0" stop-color="#e2fff4"/><stop offset=".45" stop-color="#7cf0c9"/><stop offset="1" stop-color="#34b2c6"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#86ffd6" stop-opacity=".6"/><stop offset=".45" stop-color="#5cf2b5" stop-opacity=".2"/><stop offset="1" stop-color="#5cf2b5" stop-opacity="0"/></radialGradient>
<radialGradient id="lampG"><stop offset="0" stop-color="#ffd9a6" stop-opacity=".1"/><stop offset="1" stop-color="#ffd9a6" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x2="0" y2="1"><stop offset="0" stop-color="#a6cfff"/><stop offset="1" stop-color="#3d6ea8"/></linearGradient>
<linearGradient id="potG" x2="0" y2="1"><stop offset="0" stop-color="#d4835a"/><stop offset="1" stop-color="#8a472e"/></linearGradient>
<linearGradient id="leafG" x2="1" y2="1"><stop offset="0" stop-color="#7ad89a"/><stop offset="1" stop-color="#2c7a4d"/></linearGradient>
<radialGradient id="vign" r=".75"><stop offset=".55" stop-opacity="0"/><stop offset="1" stop-opacity=".5"/></radialGradient>
<filter id="hotGlow" x="-8%" y="-12%" width="116%" height="124%"><feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feFlood flood-color="#5cf2b5" flood-opacity=".38"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="drop" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".55"/></filter>
</defs>`;
let roster = null, state = null, selected = null;

const SVG = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, text) => {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
};
/** 追加一段静态 SVG 标记（只拼接调色板/几何数字，名字等数据一律走 mk 的 textContent）。 */
const put = (el, markup) => (el.insertAdjacentHTML("beforeend", markup), el);
const isPresent = (w) => w.liveness === "live" || w.dispatchStatus === "pending";
const isWorking = (w) => isPresent(w) && !SETTLED.includes(w.workerState || "");

/** 角色名 → 稳定的外观（同一角色每次刷新长相一致）。 */
function look(name) {
  let h = 2166136261;
  for (let i = 0; i < name.length; i++) h = Math.imul(h ^ name.charCodeAt(i), 16777619);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h >>>= 0;
  const pick = (arr, s) => arr[(h >>> s) % arr.length];
  const hairstyle = (h >>> 9) % 6;
  return {
    h, hairstyle,
    skin: pick(PALETTE.skin, 0), hair: pick(PALETTE.hair, 3), shirt: pick(PALETTE.shirt, 6),
    pants: pick(PALETTE.pants, 12), neck: (h >>> 14) % 3, mug: pick(PALETTE.mug, 16),
    glasses: (h >>> 18) % 3 === 0, beard: hairstyle !== 2 && hairstyle !== 3 && (h >>> 20) % 5 === 0,
    prop: (h >>> 22) % 3, hat: pick(PALETTE.shirt, 25), jacket: pick(PALETTE.jacket, 28),
  };
}

// 发型：[脑后层, 额前层]，坐标以头心 (17,10.8) 为准。0 寸头 1 侧分 2 丸子头 3 长发 4 卷发 5 毛线帽
const CROP = "M10.5 10.8C10 5 13 2.6 17 2.6s7 2.4 6.5 8.2c-.9-2.3-2.4-3.5-4.4-3.9-1.8 1.3-4.6 1.7-6.8 1.2-.9.8-1.5 1.7-1.8 2.7Z";
const HAIR = [
  () => ["", `<path d="${CROP}"/>`],
  () => ["", `<path d="M10.3 11.6C9.5 5.4 12.6 2.4 17.2 2.4c4.4 0 7 2.8 6.4 8.4-.6-1.8-1.4-3-2.6-3.8-3 1.8-6.6 2.2-9.6 4.4Z"/>`],
  () => [`<circle cx="17" cy="2.6" r="2.9"/>`, `<path d="${CROP}"/>`],
  () => [`<path d="M9.6 11c-.4-5.6 3-8.6 7.4-8.6s7.8 3 7.4 8.6l.8 8.4c-1.4.7-3 .8-4.2.2l-.4-4.6h-7.2l-.4 4.6c-1.2.6-2.8.5-4.2-.2Z"/>`,
    `<path d="M10.8 10.4c.2-4.6 2.8-6.8 6.2-6.8s6 2.2 6.2 6.8c-2.4-.6-4.6-2-6.2-3.8-1.4 1.8-3.6 3.2-6.2 3.8Z"/>`],
  () => [`<circle cx="17" cy="8.4" r="8.4"/>`,
    `<path d="M10.4 10.4c-1.4-1.8-.8-4.4 1.1-5.2.3-2.4 2.6-3.5 4.6-2.5 1.6-1.4 4.2-1 5 .9 2.2.3 3.4 2.6 2.4 4.5.9 1.1.7 2.5-.2 3.2-.9-1.6-2.3-2.5-3.7-2.9-1.9.8-4.4.9-6.3.4-1.3.4-2.3 1-2.9 1.6Z"/>`],
  (v) => ["", `<path d="M10.6 10v2.6h1.5V10ZM21.9 10v2.6h1.5V10Z"/><g fill="${v.hat}"><path d="M10.2 8.6c0-4.6 2.8-6.6 6.8-6.6s6.8 2 6.8 6.6Z"/><circle cx="17" cy="2.2" r="1.7"/><rect x="9.8" y="7" width="14.4" height="3" rx="1.3"/></g><rect x="9.8" y="7" width="14.4" height="3" rx="1.3" fill="#000" opacity=".2"/>`],
];

/** 头部（.head 整组点头）：脑后发、耳朵、脸、下颌阴影、胡子、额前发、眉、眼（.look 视线 / .eyes 眨眼）、腮红、嘴、眼镜。 */
function head(v) {
  const [back, front] = HAIR[v.hairstyle](v);
  return `<g class="head"><g fill="${v.hair}">${back}</g>` +
    `<g fill="${v.skin}"><circle cx="10.7" cy="11.2" r="1.5"/><circle cx="23.3" cy="11.2" r="1.5"/><ellipse cx="17" cy="10.8" rx="6.3" ry="6.7"/></g>` +
    `<path d="M10.9 12.4q6.1 7 12.2 0-.5 5-6.1 5.1-5.6-.1-6.1-5.1Z" fill="#000" opacity=".1"/>` +
    (v.beard ? `<path d="M10.9 12c.5 3.8 2.8 5.6 6.1 5.6s5.6-1.8 6.1-5.6c-1 1.5-2.3 2.2-3.2 2.3-.8-.7-1.8-1-2.9-1s-2.1.3-2.9 1c-.9-.1-2.2-.8-3.2-2.3Z" fill="${v.hair}"/>` : "") +
    `<g fill="${v.hair}">${front}</g>` +
    `<path d="M13.4 8.9h2.3M18.3 8.9h2.3" stroke="${v.hair}" stroke-width=".75" stroke-linecap="round"/>` +
    `<g class="look"><g class="eyes" style="animation-delay:-${v.h % 6000}ms"><ellipse cx="14.6" cy="11.2" rx=".85" ry="1.1"/><ellipse cx="19.4" cy="11.2" rx=".85" ry="1.1"/></g></g>` +

function activeRoles() {
  const hits = new Set();
  for (const a of (state.audit?.agents || [])) if (a.active > 0) hits.add(a.agent);
  for (const w of state.workers) {
    if (!isWorking(w)) continue;
    const blob = [w.taskTitle, w.taskSpec, w.label, w.worktreeName, w.agent].filter(Boolean).join(" ").toLowerCase();
    for (const a of roster.agents) if (blob.includes(a.name.toLowerCase())) hits.add(a.name);
  }
  return hits;
}

/** 房间里的小人网格：列数按房间宽高比算并均衡每行人数，人居中于格子；小房间一列并显示名字。 */
function seats(room, agents) {
  const innerW = room.w - 28, innerH = room.h - 66, solo = agents.length <= 4;
  let cols = solo ? 1 : Math.max(2, Math.min(9, Math.round(Math.sqrt(agents.length * (innerW / innerH) * (CELL.h / CELL.w)))));
  const rows = Math.ceil(agents.length / cols);
  if (rows) cols = Math.ceil(agents.length / rows);
  const cellW = innerW / cols, cellH = innerH / Math.max(rows, 1);
  return agents.map((a, i) => ({
    agent: a,
    x: room.x + 14 + (i % cols) * cellW + (solo ? 0 : (cellW - CELL.w) / 2),
    y: room.y + 52 + Math.floor(i / cols) * cellH + (cellH - CELL.h) / 2,
  }));
}

/** 每间房先保底 110px，剩余宽度按人数分；最后一间吃掉取整误差，整排恰好铺满不越界。 */
function roomGeometry(perRoom) {
  const out = [], MIN = 110, GAP = 12;
  for (const band of PLAN) {
    const total = band.rooms.reduce((n, r) => n + (perRoom[r] || 0), 0) || 1;
    const spare = 1400 - (band.rooms.length - 1) * GAP - MIN * band.rooms.length;
    let x = 20;
    band.rooms.forEach((name, i) => {
      const w = i === band.rooms.length - 1 ? 1420 - x : Math.round(MIN + (spare * (perRoom[name] || 0)) / total);
      out.push({ name, x, y: band.y, w, h: band.h });
      x += w + GAP;
    });
  }
  return out;
}

/** 小房间的名牌：名字过长时在连字符处折行，下方一行灰字写模型与档位。 */
function nameTag(seat, right) {
  const x = seat.x + 52, a = seat.agent, n = a.name, cut = n.indexOf("-");
  const lines = n.length * 5.8 > right - x && cut > 0 ? [n.slice(0, cut + 1), n.slice(cut + 1)] : [n];
  const t = mk("text", { class: "name", x, y: seat.y + 29 - lines.length * 5.5 });
  lines.forEach((l, i) => t.appendChild(mk("tspan", { x, dy: i ? 11 : 0 }, l)));
  t.appendChild(mk("tspan", { class: "nameSub", x, dy: 11 }, `${a.model} · T${a.tier}`));
  return t;
}

function drawPlan() {
  const perRoom = {};
  for (const r of roster.rooms) perRoom[r] = roster.agents.filter((a) => a.room === r).length;
  const svg = document.getElementById("plan");
  const cy = CORRIDOR.y, ch = CORRIDOR.h;
  svg.innerHTML = DEFS +
    `<text class="planTitle" x="20" y="25">AGENT STUDIO — 3F</text>` +
    `<text class="planTitle" x="1420" y="25" text-anchor="end">${roster.agents.length} ROLES · ${roster.rooms.length} ROOMS · N ↑</text>` +

  for (const room of roomGeometry(perRoom)) {

    const { x, y, w, h } = room, ac = ACCENT[room.name] || "#8d97a6", top = y < cy;
    const ext = top ? y : y + h, inn = top ? y + h : y, door = x + 18;   // 外墙开窗，走廊侧是玻璃隔断 + 门
    const g = mk("g", { "data-room": room.name });
    g.appendChild(mk("rect", { class: "roomBox", x, y, width: w, height: h, rx: 6 }));
    let s = `<ellipse class="lamp" cx="${x + w / 2}" cy="${y + h * .58}" rx="${w * .5}" ry="${h * .46}" fill="url(#lampG)"/>` +
      `<rect x="${x + 10}" y="${y + 46}" width="${w - 20}" height="${h - 56}" rx="8" fill="${ac}" fill-opacity=".045" stroke="${ac}" stroke-opacity=".16"/>` +
      `<rect x="${x + 15}" y="${y + 51}" width="${w - 30}" height="${h - 66}" rx="5" fill="none" stroke="${ac}" stroke-opacity=".1" stroke-dasharray="3 4"/>` +
      `<rect x="${x + 1.5}" y="${y + 1.5}" width="${w - 3}" height="36" rx="4.5" fill="url(#wallG)"/><path d="M${x + 1.5} ${y + 38}h${w - 3}" stroke="#000" stroke-opacity=".35"/>` +
      `<rect x="${x + 14}" y="${y + 13}" width="3" height="13" rx="1.5" fill="${ac}"/>`;
    const nWin = Math.max(1, Math.floor((w - 30) / 74)), span = (w - 30) / nWin;
    for (let i = 0; i < nWin; i++) {
      const wx = x + 21 + i * span;
      s += `<rect class="win" x="${wx}" y="${ext - 2.5}" width="${span - 12}" height="5" rx="1"/><path class="blind" d="M${wx + 2} ${ext}h${span - 16}"/>`;
    }
    const gw = `M${x + 8} ${inn}H${door - 2}M${door + 30} ${inn}H${x + w - 8}`;
    s += `<path class="glassWall" d="${gw}"/><path class="glassLine" d="${gw}"/>` +
      `<rect x="${door}" y="${top ? inn - 2 : 510}" width="28" height="12" fill="#151b24"/>` +
      `<path d="M${door + 2} ${inn + (top ? 2 : -2)}h15" stroke="#9cc4ff" stroke-opacity=".55" stroke-width="1.6"/>`;
    const x0 = x + 37 + room.name.length * 9.2, x1 = x + w - 107;   // 标题与人数之间的墙面放玻璃白板
    if (x1 - x0 >= 80) {
      const bw = Math.min(120, x1 - x0), bx = (x0 + x1 - bw) / 2, n = bw * .42;
      s += `<g transform="translate(${bx} ${y + 7})"><rect width="${bw}" height="24" rx="2" fill="#c8d6ea" fill-opacity=".07" stroke="#c8d6ea" stroke-opacity=".22"/>` +
        `<path d="M6 9q4-5 8 0t8 0" stroke="${ac}" stroke-opacity=".8" fill="none" stroke-linecap="round"/><path d="M6 15h${bw * .3}M6 19h${bw * .2}" stroke="#c8d6ea" stroke-opacity=".35" stroke-linecap="round"/>` +
        `<rect x="${n}" y="4" width="7" height="7" fill="#f7d36b" transform="rotate(-6 ${n + 3.5} 7.5)"/><rect x="${n + 9}" y="7" width="7" height="7" fill="#ff9fb2" transform="rotate(5 ${n + 12.5} 10.5)"/>` +
        `<path d="M${bw - 24} 20v-6M${bw - 18} 20v-11M${bw - 12} 20v-8" stroke="${ac}" stroke-opacity=".65" stroke-width="3"/><path d="M3 24.8h${bw - 6}" stroke="#5d6776" stroke-width="1.4"/></g>`;
    }
    if (agents.length === 1) s += shelf(x + w - 42, y + 52);
    s += plant(x + w - 20, y + h - 12);

    put(g, s);
    g.appendChild(mk("text", { class: "roomTitle", x: x + 23, y: y + 24 }, room.name.toUpperCase()));

    for (const seat of seats(room, agents)) {

  put(svg, `<rect class="vig" width="1440" height="900" fill="url(#vign)"/><g class="legend" transform="translate(24 846)">` +
    `<rect y="6" width="18" height="12" rx="2" fill="url(#scrOff)" stroke="#3b4453"/><text x="26" y="16">idle · 暗屏</text>` +
    `<ellipse cx="139" cy="12" rx="16" ry="11" fill="url(#halo)"/><rect x="130" y="6" width="18" height="12" rx="2" fill="url(#scrOn)"/><text x="156" y="16">working · 亮屏 + 打字</text>` +
    `<rect x="318" y="5" width="20" height="14" rx="3" fill="none" stroke="#5cf2b5" stroke-opacity=".8"/><text x="346" y="16">房间有人在忙</text>` +
    `<path d="M450 4h22a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-8l-3 3-3-3h-8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" fill="#111821" stroke="#2e3a4a"/><text x="484" y="16">走廊 = Orca 监督中的来访工人</text>` +
    `<text x="1392" y="16" text-anchor="end">点击或 Tab 聚焦小人 → 右侧看详情</text></g>`);
}

function paint(st) {
  state = st;
  const hits = activeRoles();
  const svg = document.getElementById("plan");

  for (const w of svg.querySelectorAll(".worker[data-role]")) {
    const on = hits.has(w.dataset.role);
    w.classList.toggle("working", on);
    w.classList.toggle("picked", w.dataset.role === selected);
    w.querySelector(".head")?.classList.toggle("bob", on);
  }
  for (const g of svg.querySelectorAll("g[data-room]")) {
    const room = g.dataset.room;
    const members = roster.agents.filter((a) => a.room === room);
    const busy = members.filter((a) => hits.has(a.name)).length;
    g.querySelector(".roomBox").classList.toggle("hot", busy > 0);
    const meta = g.querySelector(`[data-meta="${room}"]`);
    if (meta) meta.textContent = `${members.length} 人${busy ? " · " + busy + " 忙" : ""}`;
  }

  for (const old of svg.querySelectorAll("g[data-visitor], .corrEmpty")) old.remove();
  const visitors = state.workers.filter(isPresent).slice(0, 7);
  visitors.forEach((w, i) => {
    const x = 64 + i * 188, y = CORRIDOR.y + 66, on = isWorking(w), c = x + 91;
    const g = mk("g", { "data-visitor": w.dispatchId });
    g.appendChild(mk("path", { class: "bubble", d: `M${x + 9} ${y - 40}h164a9 9 0 0 1 9 9v14a9 9 0 0 1-9 9H${c + 6}l-6 6-6-6H${x + 9}a9 9 0 0 1-9-9v-14a9 9 0 0 1 9-9Z` }));
    g.appendChild(mk("circle", { class: "vdot" + (on ? " on" : w.dispatchStatus === "pending" ? " wait" : ""), cx: x + 14, cy: y - 24, r: 3.5 }));
    g.appendChild(mk("text", { class: "visitorText", x: x + 24, y: y - 26 }, (w.label || w.dispatchId).slice(0, 25)));
    g.appendChild(mk("text", { class: "visitorState", x: x + 24, y: y - 14 }, `${w.workerState || w.dispatchStatus || "-"} · ${w.liveness || "-"}`.slice(0, 28)));
    g.appendChild(stander(x + 80, y, w.label || w.dispatchId, on));
    g.appendChild(mk("title", {}, [w.label || w.dispatchId, w.taskTitle].filter(Boolean).join(" — ")));
    svg.appendChild(g);
  });
  if (!visitors.length) svg.appendChild(mk("text", { class: "corridorLabel corrEmpty", x: 720, y: CORRIDOR.y + 78, "text-anchor": "middle" }, "（走廊空着：当前没有 Orca 监督的工人）"));

  // KPI 与地板一致：亮着的小人数 = 活跃角色数（审计流 ∪ 工人任务文本）
  document.getElementById("k-work").textContent = hits.size;
  document.getElementById("k-sub").textContent = (state.audit?.agents || []).reduce((n, a) => n + a.active, 0);
  document.getElementById("k-visit").textContent = state.workers.filter(isPresent).length;
  document.getElementById("k-kb").textContent = state.kanban.length;
  document.getElementById("sub").textContent = `状态 ${new Date(state.ts).toLocaleTimeString()} · ${state.worktrees.length} 仓库 · ${hits.size} 角色工作中`;

  const detail = document.getElementById("detail");
  detail.textContent = "";
  if (!selected) {
    detail.appendChild(Object.assign(document.createElement("div"), { className: "empty", textContent: "点办公室里的小人看角色详情；屏幕发亮 = 正在工作。" }));
  } else {
    const a = roster.agents.find((x) => x.name === selected);
    const last = (state.audit?.events || []).filter((e) => e.agent === selected).slice(-1)[0];
    const rows = [
      ["房间", a.room],
      ["档位", a.model],
      ["状态", hits.has(a.name) ? "工作中" : "空闲"],
      ["最近审计", last ? `${last.kind === "invoked" ? "▶ invoked" : "■ completed"} ${last.ts.slice(-6)}` : "无记录"],
    ];
    for (const [k, v] of rows) {
      const row = document.createElement("div");
      row.className = "row";
      row.appendChild(Object.assign(document.createElement("span"), { textContent: k }));
      row.appendChild(Object.assign(document.createElement("b"), { className: "role" + (k === "状态" && hits.has(a.name) ? " on" : ""), textContent: String(v) }));
      detail.appendChild(row);
    }
    const desc = document.createElement("div");
    desc.className = "hint";
    desc.textContent = a.desc;
    detail.appendChild(desc);
    document.getElementById("detail-title").textContent = a.name;
  }

  const act = document.getElementById("active");
  act.textContent = "";
  if (!hits.size) act.appendChild(Object.assign(document.createElement("div"), { className: "empty", textContent: "无" }));
  for (const role of [...hits].sort()) {
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(Object.assign(document.createElement("span"), { className: "role", textContent: role }));
    row.appendChild(Object.assign(document.createElement("b"), { textContent: roster.agents.find((a) => a.name === role)?.room ?? "—" }));
    act.appendChild(row);
  }
}

async function tick() {
  try { paint(await (await fetch("/state", { cache: "no-store" })).json()); document.body.classList.remove("down"); }
  catch (e) { document.body.classList.add("down"); document.getElementById("sub").textContent = "服务未响应：" + e.message; }
}
(async () => {
  roster = await (await fetch("/roster.json")).json();
  drawPlan();
  await tick();
  setInterval(tick, 2000);
})();
</script>
</body>
